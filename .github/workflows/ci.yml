name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Build and run tests
        run: make test
