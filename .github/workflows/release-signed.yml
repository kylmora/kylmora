name: Release (signed, not notarized)

# A stand-in for the usual Release workflow while Apple's notary service is not
# processing this team's submissions. Everything is identical except that the
# build is not sent to Apple: it is signed with the same Developer ID, with the
# same hardened runtime and secure timestamp, so macOS identifies the developer
# and the one-time right-click to open is the only difference for users.
#
# Run by hand from the Actions tab against an existing tag. Delete this file
# once notarization works again — .github/workflows/release.yml is the real one
# and has been left alone.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & attach signed .dmg
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use the committed icon
        run: touch Resources/Kylmora.icns

      - name: Stamp the version from the tag
        run: |
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "Building Kylmora $VERSION (build $GITHUB_RUN_NUMBER)"
        env:
          TAG: ${{ inputs.tag }}

      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          echo "DEV_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Build the app bundle
        run: make bundle DEV_ID="$DEV_ID"

      - name: Package the styled .dmg
        run: |
          python3 -m venv dmgvenv
          ./dmgvenv/bin/pip install --quiet dmgbuild Pillow
          ./dmgvenv/bin/dmgbuild -D app="build/Kylmora.app" \
            -s Tools/dmg-settings.py "Kylmora" "build/Kylmora.dmg"

      - name: Sign the .dmg
        run: codesign --force --sign "$DEV_ID" --timestamp build/Kylmora.dmg

      # Recorded in the log so the published build's exact signing state is
      # evidence rather than a claim. `spctl` is expected to reject an
      # unnotarized image, so its verdict is reported, not enforced.
      - name: Report what Gatekeeper sees
        run: |
          codesign -dv --verbose=4 build/Kylmora.dmg 2>&1 | grep -Ei "Authority|Timestamp=|flags" || true
          codesign --verify --deep --strict --verbose=2 build/Kylmora.app
          echo "--- spctl assessment ---"
          spctl --assess --type open --context context:primary-signature -vv build/Kylmora.dmg || true

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: build/Kylmora.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### Install

            Download `Kylmora.dmg` below, open it, and drag
            **Kylmora** to Applications.

            **First launch:** right-click (or Control-click) Kylmora in
            Applications and choose **Open**, then confirm. Only the first time —
            after that it opens normally.

            This build is signed with a verified Apple Developer ID, so macOS
            shows who made it. It has not been through Apple's notarization
            service, which is why the first launch takes that extra step.

            Requires macOS 14 or later.

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12"
