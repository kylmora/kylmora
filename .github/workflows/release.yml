name: Release

on:
  push:
    tags:
      - 'v*'

# Only reads the repo. This workflow deliberately publishes nothing: creating
# the Release is Publish notarized releases' job, and only once Apple has
# accepted both the app and the disk image.
permissions:
  contents: read

# Two tags in flight are two independent builds; the same tag pushed twice
# queues rather than races.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & submit for notarization
    runs-on: macos-26
    # Nothing here waits on Apple, so this is just a build's worth of time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The icon (Resources/Kylmora.icns) is committed. Keep its timestamp newer
      # than its sources so `make bundle` uses it instead of regenerating it,
      # which would require Pillow.
      - name: Use the committed icon
        run: touch Resources/Kylmora.icns

      # Single source of truth for the version: the git tag. `vX.Y.Z` becomes the
      # app's version, so there is never a version number to bump by hand.
      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "Building Kylmora $VERSION (build $GITHUB_RUN_NUMBER)"

      # Put the Developer ID certificate into a throwaway keychain that exists
      # only for this job, so codesign can find the identity.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          echo "DEV_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      # Signed with the hardened runtime and a secure timestamp — both are
      # required for notarisation.
      - name: Build the app bundle
        run: make bundle DEV_ID="$DEV_ID"

      # ditto, not zip: a .app is full of symlinks and permission bits that a
      # plain archive mangles. This same zip is both what Apple receives and
      # what the publisher unpacks later, so the bundle survives the handoff.
      - name: Submit the app to Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p pending
          ditto -c -k --keepParent build/Kylmora.app pending/Kylmora.app.zip
          Tools/notarize.sh submit pending/Kylmora.app.zip > pending/submission-id.txt
          echo "Submitted $(cat pending/submission-id.txt) for $GITHUB_REF_NAME"

      # Parked where the publisher can find it. A workflow artifact is private
      # to the repo, so nothing unnotarised is reachable by a user.
      - name: Park the app until Apple answers
        uses: actions/upload-artifact@v4
        with:
          name: pending-app-${{ github.ref_name }}
          path: pending/
          retention-days: 30
          if-no-files-found: error

      - name: Where this goes next
        run: |
          {
            echo "### Submitted to Apple :hourglass:"
            echo ""
            echo "App submission \`$(cat pending/submission-id.txt)\` for **$GITHUB_REF_NAME**."
            echo ""
            echo "**Publish notarized releases** takes it from here, checking every"
            echo "15 minutes:"
            echo ""
            echo "1. Apple accepts the app → staple it, build the .dmg, submit that too"
            echo "2. Apple accepts the .dmg → staple it and publish the release"
            echo ""
            echo "No release exists until both are notarized."
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner is torn down anyway, but the private key should not outlive
      # the job even if a later step fails.
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12"
