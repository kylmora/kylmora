name: Release

on:
  push:
    tags:
      - 'v*'

# Needed so the built-in token can create a Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & attach .dmg
    runs-on: macos-26
    # No timeout-minutes on purpose: GitHub's own six-hour job limit is the only
    # cap. Notarisation waits on Apple, which has no guaranteed ceiling, and a
    # shorter cap here only turns a slow submission into a failed build.
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The icon (Resources/Kylmora.icns) is committed. Keep its timestamp newer
      # than its sources so `make bundle` uses it instead of regenerating it,
      # which would require Pillow.
      - name: Use the committed icon
        run: touch Resources/Kylmora.icns

      # Single source of truth for the version: the git tag. `vX.Y.Z` becomes the
      # app's version, so there is never a version number to bump by hand.
      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Kylmora $VERSION (build $GITHUB_RUN_NUMBER)"

      # Put the Developer ID certificate into a throwaway keychain that exists
      # only for this job, so codesign can find the identity.
      # The installer certificate (for the .pkg) may be inside the same .p12
      # or in its own optional secret, MACOS_INSTALLER_CERT_P12 (+ _PASSWORD).
      - name: Import the signing certificates
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            -T /usr/bin/pkgbuild -T /usr/bin/productsign
          if [ -n "$INSTALLER_CERT_P12" ]; then
            echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
              -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
              -T /usr/bin/pkgbuild -T /usr/bin/productsign
          fi
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/installer.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          echo "DEV_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"
          # A .pkg is signed with a *Developer ID Installer* certificate, a
          # different one from the Application certificate above. It is
          # optional: without it the installer package is still built, just
          # unsigned, and the step that makes it says so. Not `-p codesigning`
          # -- installer certificates do not carry that policy.
          INSTALLER=$(security find-identity -v "$KEYCHAIN" \
            | grep 'Developer ID Installer' | head -1 \
            | sed -E 's/.*"(.*)"/\1/' || true)
          echo "INSTALLER_ID=$INSTALLER" >> "$GITHUB_ENV"
          echo "Installer identity: ${INSTALLER:-none (the .pkg will be unsigned)}"

      # Signed with the hardened runtime and a secure timestamp — both are
      # required for notarisation.
      - name: Build the app bundle
        run: make bundle DEV_ID="$DEV_ID"

      # Apple checks the app, then the ticket is stapled into the bundle so it
      # validates even on a machine that is offline. This blocks for as long as
      # Apple takes.
      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: Tools/notarize.sh build/Kylmora.app

      # A styled installer image: a compact window, the app beside an
      # /Applications shortcut, and an arrow background. dmgbuild writes the
      # window layout directly (no Finder scripting), so it works headlessly.
      # Built around the stapled app, so what ships already carries its ticket.
      - name: Package the styled .dmg
        run: |
          python3 -m venv dmgvenv
          ./dmgvenv/bin/pip install --quiet dmgbuild Pillow
          ./dmgvenv/bin/dmgbuild -D app="build/Kylmora.app" \
            -s Tools/dmg-settings.py "Kylmora" "build/Kylmora.dmg"

      # The disk image is notarised in its own right, so the download itself is
      # trusted — not just the app once it has been copied out.
      - name: Sign and notarize the .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --sign "$DEV_ID" --timestamp build/Kylmora.dmg
          Tools/notarize.sh build/Kylmora.dmg
          # What Gatekeeper itself will say when a user opens the download.
          spctl --assess --type open --context context:primary-signature -vv build/Kylmora.dmg

      # An installer package for fleets. A device-management tool (Intune,
      # Jamf, Kandji...) installs a .pkg silently as root on every enrolled
      # Mac; a .dmg needs a person to open it and drag. Built from the same
      # stapled app the disk image carries.
      #
      # Signed and notarized when a Developer ID Installer certificate is in
      # the keychain. Without one the package is still published unsigned:
      # an MDM installs it regardless (Gatekeeper only checks what a person
      # opens), but a user double-clicking it would be warned, and Apple does
      # not notarize unsigned packages -- so the .dmg stays the download for
      # people and the .pkg is for administrators.
      - name: Build the installer .pkg
        run: make pkg INSTALLER_ID="$INSTALLER_ID"

      - name: Notarize the .pkg
        if: env.INSTALLER_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          Tools/notarize.sh build/Kylmora.pkg
          spctl --assess --type install -vv build/Kylmora.pkg

      # Only reached once the app and the disk image are notarized and
      # stapled, so an unnotarised build can never become a release.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Kylmora.dmg
            build/Kylmora.pkg
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ### Install

            Download `Kylmora.dmg` below, open it, and drag
            **Kylmora** to Applications.

            Signed with a Developer ID and notarized by Apple, so it opens
            normally — no security warning to click through.

            Requires macOS 14 or later.

            ### For IT administrators

            `Kylmora.pkg` installs the app to `/Applications` silently, for
            deployment through an MDM such as Jamf, Intune or Kandji. To lock
            settings across a fleet, see
            [docs/enterprise-policies.md](https://github.com/kylmora/kylmora/blob/main/docs/enterprise-policies.md)
            and the sample profile in `Resources/Enterprise/`.

      # The runner is torn down anyway, but the private key should not outlive
      # the job even if a later step fails.
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/Kylmora.app.zip"
