name: Release

on:
  push:
    tags:
      - 'v*'

# Needed so the built-in token can create a Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & attach .dmg
    runs-on: macos-26
    # Notarisation waits on Apple, which is usually minutes but has no
    # guaranteed ceiling. Fail in an hour rather than burn the 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The icon (Resources/Kylmora.icns) is committed. Keep its timestamp newer
      # than its sources so `make bundle` uses it instead of regenerating it,
      # which would require Pillow.
      - name: Use the committed icon
        run: touch Resources/Kylmora.icns

      # Single source of truth for the version: the git tag. `vX.Y.Z` becomes the
      # app's version, so there is never a version number to bump by hand.
      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "Building Kylmora $VERSION (build $GITHUB_RUN_NUMBER)"

      # Put the Developer ID certificate into a throwaway keychain that exists
      # only for this job, so codesign can find the identity.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          echo "DEV_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      # Signed with the hardened runtime and a secure timestamp — both are
      # required for notarisation.
      - name: Build the app bundle
        run: make bundle DEV_ID="$DEV_ID"

      # Apple checks the app, then we staple the ticket into the bundle so it
      # validates even on a machine that is offline.
      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: Tools/notarize.sh build/Kylmora.app

      # A styled installer image: a compact window, the app beside an
      # /Applications shortcut, and an arrow background. dmgbuild writes the
      # window layout directly (no Finder scripting), so it works headlessly.
      - name: Package the styled .dmg
        run: |
          python3 -m venv dmgvenv
          ./dmgvenv/bin/pip install --quiet dmgbuild Pillow
          ./dmgvenv/bin/dmgbuild -D app="build/Kylmora.app" \
            -s Tools/dmg-settings.py "Kylmora" "build/Kylmora.dmg"

      # The disk image is notarised in its own right, so the download itself is
      # trusted — not just the app once it has been copied out.
      - name: Sign and notarize the .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --sign "$DEV_ID" --timestamp build/Kylmora.dmg
          Tools/notarize.sh build/Kylmora.dmg
          # What Gatekeeper itself will say when a user opens the download.
          spctl --assess --type open --context context:primary-signature -vv build/Kylmora.dmg

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/Kylmora.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### Install

            Download `Kylmora.dmg` below, open it, and drag
            **Kylmora** to Applications.

            Signed with a Developer ID and notarized by Apple, so it opens
            normally — no security warning to click through.

            Requires macOS 14 or later.

      # The runner is torn down anyway, but the private key should not outlive
      # the job even if a later step fails.
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/Kylmora.zip"
