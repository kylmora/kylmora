name: Release

on:
  push:
    tags:
      - 'v*'

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# whoever owns the action can move v4 to different code, and this workflow holds
# the signing identity and the notarisation credentials, so "whatever v4 points
# at today" is a signing key handed to a stranger. The trailing comment records
# which release each SHA was, because a bare SHA tells a reader nothing.
#
# To move one on: read the action's release notes, resolve the new tag with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> -q .object.sha
# and, if that returns a tag object rather than a commit, dereference it with
#   gh api repos/<owner>/<repo>/git/tags/<sha> -q .object.sha

# Needed so the built-in token can create a Release and upload assets.
permissions:
  contents: write

jobs:
  # One job per architecture variant, run at the same time. The slow part of a
  # release is notarisation -- Apple's queue, which this repository does not
  # control -- and doing the universal and Apple Silicon halves in sequence
  # meant waiting through six submissions end to end. Split, each runner waits
  # through three of its own, so the release takes about as long as the slower
  # half rather than the sum of both.
  #
  # Each job is self-contained: its own keychain, its own build, its own three
  # artifacts. Nothing is shared, so nothing has to be synchronised.
  build:
    name: Build ${{ matrix.variant }}
    runs-on: macos-26
    # No timeout-minutes on purpose: GitHub's own six-hour job limit is the only
    # cap. Notarisation waits on Apple, which has no guaranteed ceiling, and a
    # shorter cap here only turns a slow submission into a failed build.
    strategy:
      # One variant failing should stop the other: a release is all four files
      # or none, so there is nothing to gain by finishing the survivor.
      fail-fast: true
      matrix:
        include:
          - variant: universal
            archs: arm64 x86_64
            suffix: ''
          - variant: apple-silicon
            archs: arm64
            suffix: '-AppleSilicon'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # The icon (Resources/Kylmora.icns) is committed. Keep its timestamp newer
      # than its sources so `make bundle` uses it instead of regenerating it,
      # which would require Pillow.
      - name: Use the committed icon
        run: touch Resources/Kylmora.icns

      # Single source of truth for the version: the git tag. `vX.Y.Z` becomes the
      # app's version, so there is never a version number to bump by hand.
      #
      # Both jobs read the same tag and the same run number, so the two variants
      # of a release always carry identical version and build numbers.
      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Kylmora $VERSION (build $GITHUB_RUN_NUMBER) -- ${{ matrix.variant }}"

      # Put the Developer ID certificate into a throwaway keychain that exists
      # only for this job, so codesign can find the identity.
      # The installer certificate (for the .pkg) may be inside the same .p12
      # or in its own optional secret, MACOS_INSTALLER_CERT_P12 (+ _PASSWORD).
      - name: Import the signing certificates
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            -T /usr/bin/pkgbuild -T /usr/bin/productsign
          if [ -n "$INSTALLER_CERT_P12" ]; then
            echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
              -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
              -T /usr/bin/pkgbuild -T /usr/bin/productsign
          fi
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/installer.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          echo "DEV_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"
          # A .pkg is signed with a *Developer ID Installer* certificate, a
          # different one from the Application certificate above. It is
          # optional: without it the installer package is still built, just
          # unsigned, and the step that makes it says so. Not `-p codesigning`
          # -- installer certificates do not carry that policy.
          INSTALLER=$(security find-identity -v "$KEYCHAIN" \
            | grep 'Developer ID Installer' | head -1 \
            | sed -E 's/.*"(.*)"/\1/' || true)
          echo "INSTALLER_ID=$INSTALLER" >> "$GITHUB_ENV"
          echo "Installer identity: ${INSTALLER:-none (the .pkg will be unsigned)}"

      # Signed with the hardened runtime and a secure timestamp — both are
      # required for notarisation.
      - name: Build the app bundle
        run: make bundle DEV_ID="$DEV_ID" ARCHS="${{ matrix.archs }}"

      # If ARCHS were ever dropped or misspelled the build would still succeed
      # and still notarize -- and ship an Apple-Silicon-only binary under the
      # name people download for their Intel Mac. Checked, not assumed.
      - name: Check the binary carries the architectures it claims
        run: |
          set -e
          bin=build/Kylmora.app/Contents/MacOS/Kylmora
          lipo -info "$bin"
          for arch in ${{ matrix.archs }}; do
            lipo -info "$bin" | grep -q "$arch" || { echo "missing $arch"; exit 1; }
          done
          # The universal build must not quietly become single-architecture,
          # and the Apple Silicon one must not quietly carry Intel code.
          count=$(lipo -archs "$bin" | wc -w | tr -d ' ')
          expected=$(echo "${{ matrix.archs }}" | wc -w | tr -d ' ')
          test "$count" -eq "$expected" || { echo "expected $expected slices, found $count"; exit 1; }

      # Apple checks the app, then the ticket is stapled into the bundle so it
      # validates even on a machine that is offline. This blocks for as long as
      # Apple takes.
      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: Tools/notarize.sh build/Kylmora.app

      - name: Install dmgbuild
        run: |
          python3 -m venv dmgvenv
          ./dmgvenv/bin/pip install --quiet dmgbuild Pillow

      # A styled installer image: a compact window, the app beside an
      # /Applications shortcut, and an arrow background. dmgbuild writes the
      # window layout directly (no Finder scripting), so it works headlessly.
      # Built around the stapled app, so what ships already carries its ticket.
      - name: Package the styled .dmg
        run: |
          ./dmgvenv/bin/dmgbuild -D app="build/Kylmora.app" \
            -s Tools/dmg-settings.py "Kylmora" "build/Kylmora${{ matrix.suffix }}.dmg"

      # The disk image is notarised in its own right, so the download itself is
      # trusted — not just the app once it has been copied out.
      - name: Sign and notarize the .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --sign "$DEV_ID" --timestamp build/Kylmora${{ matrix.suffix }}.dmg
          Tools/notarize.sh build/Kylmora${{ matrix.suffix }}.dmg
          # What Gatekeeper itself will say when a user opens the download.
          spctl --assess --type open --context context:primary-signature -vv build/Kylmora${{ matrix.suffix }}.dmg

      # An installer package for fleets. A device-management tool (Intune,
      # Jamf, Kandji...) installs a .pkg silently as root on every enrolled
      # Mac; a .dmg needs a person to open it and drag. Built from the same
      # stapled app the disk image carries.
      #
      # Signed and notarized when a Developer ID Installer certificate is in
      # the keychain. Without one the package is still published unsigned:
      # an MDM installs it regardless (Gatekeeper only checks what a person
      # opens), but a user double-clicking it would be warned, and Apple does
      # not notarize unsigned packages -- so the .dmg stays the download for
      # people and the .pkg is for administrators.
      - name: Build the installer .pkg
        run: make pkg INSTALLER_ID="$INSTALLER_ID" PKG_SUFFIX="${{ matrix.suffix }}"

      - name: Notarize the .pkg
        if: env.INSTALLER_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          Tools/notarize.sh build/Kylmora${{ matrix.suffix }}.pkg
          spctl --assess --type install -vv build/Kylmora${{ matrix.suffix }}.pkg

      # Handed to the publish job below. Only the finished, stapled files --
      # the app bundle and the build tree are not worth carrying between jobs.
      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kylmora-${{ matrix.variant }}
          path: |
            build/Kylmora${{ matrix.suffix }}.dmg
            build/Kylmora${{ matrix.suffix }}.pkg
          if-no-files-found: error
          retention-days: 1

      # The runner is torn down anyway, but the private key should not outlive
      # the job even if a later step fails.
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/Kylmora.app.zip"

  # Reached only once both variants are notarized and stapled, so an
  # unnotarised build can never become a release, and a release is never
  # published with half its downloads missing. Linux: this job only moves
  # files that are already signed.
  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect both variants
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/Kylmora.dmg
            dist/Kylmora-AppleSilicon.dmg
            dist/Kylmora.pkg
            dist/Kylmora-AppleSilicon.pkg
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ### Install

            | Download | For |
            |---|---|
            | `Kylmora.dmg` | Any Mac — Apple Silicon or Intel |
            | `Kylmora-AppleSilicon.dmg` | Apple Silicon only, a smaller download |

            Open it and drag **Kylmora** to Applications. If you are not sure
            which one you want, take `Kylmora.dmg` — it runs everywhere.

            Signed with a Developer ID and notarized by Apple, so it opens
            normally — no security warning to click through.

            Requires macOS 14 or later. Page translation needs macOS 15 and
            extensions need macOS 15.4; the rest works on macOS 14.

            ### For IT administrators

            | Package | For |
            |---|---|
            | `Kylmora.pkg` | Any Mac — Apple Silicon or Intel |
            | `Kylmora-AppleSilicon.pkg` | Apple Silicon only, a smaller payload |

            Either installs the app to `/Applications` silently, for
            deployment through an MDM such as Jamf, Intune or Kandji. To lock
            settings across a fleet, see
            [docs/enterprise-policies.md](https://github.com/kylmora/kylmora/blob/main/docs/enterprise-policies.md)
            and the sample profile in `Resources/Enterprise/`.
